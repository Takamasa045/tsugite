name: remotion
motion_review:
  surface: React / Remotion
  method: Reactコンポーネントをフレーム値、interpolate、springで制御
  preview: html-css-approximation
capabilities:
  fast_edit:
    supported: true
    source_video: true
    cards: true
    captions: true
    word_emphasis: true
    text_effects: true
    transitions: true
    zoom: true
    sfx: true
    progress: true
    global_style: true
    color_treatment: true
    energy_pacing: true
    vertical: true
    horizontal: true
    audio: true
    final_mp4: true
  captions: true
  transitions: true
  audio_mix: true
  vertical: true
  fps: [24, 30, 60]
  presets: [article-dialogue-16x9, street-dialogue-16x9, street-dialogue-9x16, tsugite-summer-camp-generated-16x9, miraichi-lastcall-9x16, orbital-showreel-16x9, skate-cam-16x9, kusakari-title-card, passthrough-16x9]
checks:
  setup:
    - type: command
      name: tool:remotion
      command: ["node", "--input-type=module", "--eval", "await Promise.all([import('@remotion/renderer'), import('@remotion/bundler')])"]
      remediation:
        default: "Run `npm ci` from the Tsugite repository root, then rerun doctor."
