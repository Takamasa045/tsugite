name: hyperframes
motion_review:
  surface: HTML / CSS / HyperFrames
  method: DOMレイヤーをCSSとタイムラインで制御
  preview: html-css-approximation
capabilities:
  fast_edit:
    supported: true
    source_video: true
    cards: true
    captions: true
    word_emphasis: true
    text_effects: true
    transitions: true
    zoom: true
    sfx: true
    progress: true
    global_style: true
    color_treatment: true
    energy_pacing: true
    vertical: true
    horizontal: true
    audio: true
    final_mp4: true
  captions: true
  transitions: true
  audio_mix: true
  vertical: true
  fps: [24, 30]
  presets: [article-explainer-16x9, article-explainer-9x16]
checks:
  setup:
    - type: command
      name: tool:hyperframes
      command: ["npx", "--no-install", "hyperframes", "--version"]
      capture_version: true
      remediation:
        default: "Run `npm ci` without `--omit=dev` from the Tsugite repository root, then rerun doctor."
  render_preflight:
    - name: lint
      command: ["npx", "--no-install", "hyperframes", "lint", "--json"]
