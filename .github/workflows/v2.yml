name: Tsugite v2 offline
on:
  pull_request:
    paths: ['v2/**', '.github/workflows/v2.yml']
  push:
    branches: [main]
    paths: ['v2/**', '.github/workflows/v2.yml']
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - run: npm ci --ignore-scripts
      - run: npm run security:audit
        if: runner.os == 'Linux'
      - run: npm run check
      - run: npm run test:offline
      - run: npm run test:extended
      - run: npm pack --dry-run
  remotion-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm --prefix v2 ci --ignore-scripts
      - run: npm --prefix v2/plugins/remotion install --ignore-scripts
      - run: test -x /usr/bin/google-chrome
      - run: node --test v2/tests/renderers.node.mjs
        env:
          TSUGITE_BROWSER: /usr/bin/google-chrome
          TSUGITE_RENDERER_PEERS: ${{ github.workspace }}/v2/plugins/remotion/node_modules
