name: Tsugite v2 offline

env:
  NPM_CONFIG_AUDIT: 'false'
on:
  pull_request:
    paths: ['v2/**', '.github/workflows/v2.yml', '.nvmrc', 'package.json']
  push:
    branches: [main]
    paths: ['v2/**', '.github/workflows/v2.yml', '.nvmrc', 'package.json']
permissions:
  contents: read
jobs:
  offline:
    name: ${{ matrix.node == '22.23.4' && format('offline ({0})', matrix.os) || format('offline ({0}, Node {1})', matrix.os, matrix.node) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.23.4', '24.22.1', '26.12.1']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm install --global npm@10.9.8 --no-audit --no-fund
      - name: Verify patched Node runtime
        run: >-
          node -e "console.log(JSON.stringify({version:process.version,execPath:process.execPath})); if (process.version !== 'v${{ matrix.node }}') process.exit(1)"
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            $winget = Get-Command winget -ErrorAction SilentlyContinue
            if ($winget) {
              & $winget.Source install --id Gyan.FFmpeg -e --accept-package-agreements --accept-source-agreements --silent --disable-interactivity

              $packages = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Packages"
              $probe = Get-ChildItem $packages -Filter ffprobe.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($probe) {
                $binDirectory = $probe.Directory.FullName
                $env:PATH = "$binDirectory;$env:PATH"
                Add-Content -Path $env:GITHUB_PATH -Value $binDirectory
              }
            }
          }

          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version 8.1.2 --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "FFmpeg installation failed through winget and Chocolatey"
            }
          }

          ffmpeg -version
          ffprobe -version
      - run: npm ci --ignore-scripts
      - run: npm run security:audit
        if: runner.os == 'Linux'
      - run: npm run check
      - run: npm run test:offline
      - run: npm run test:extended
      - run: npm pack --dry-run
  remotion-smoke:
    name: ${{ matrix.node == '22.23.4' && 'remotion-smoke' || format('remotion-smoke-node-{0}', matrix.node) }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global npm@10.9.8 --no-audit --no-fund
      - name: Verify patched Node runtime
        run: >-
          node -e "console.log(JSON.stringify({version:process.version,execPath:process.execPath})); if (process.version !== 'v${{ matrix.node }}') process.exit(1)"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm --prefix v2 ci --ignore-scripts
      - run: npm --prefix v2/plugins/remotion install --ignore-scripts
      - run: test -x /usr/bin/google-chrome
      # Remotion leaves Chrome/esbuild handles after a successful render; force
      # the runner to exit so the job is not cancelled by timeout-minutes.
      - run: node --test --test-force-exit v2/tests/renderers.node.mjs
        env:
          TSUGITE_BROWSER: /usr/bin/google-chrome
          TSUGITE_RENDERER_PEERS: ${{ github.workspace }}/v2/plugins/remotion/node_modules
