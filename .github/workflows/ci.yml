name: CI

env:
  NPM_CONFIG_AUDIT: 'false'

# Push CI only on the default branch so feature-branch pushes do not double-run
# with pull_request. Cancel superseded in-progress runs for the same PR or ref.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  download-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: apps/download-site/package-lock.json
      - name: Verify patched Node runtime
        run: >-
          node -e "console.log(JSON.stringify({version:process.version,execPath:process.execPath})); if (process.version !== 'v22.23.4') process.exit(1)"
      - run: npm --prefix apps/download-site ci
      - run: npm --prefix apps/download-site test
      - run: npm --prefix apps/download-site run lint
      - run: npm --prefix apps/download-site run security:audit

  check:
    name: ${{ matrix.node == '22.23.4' && 'check' || format('check-node-{0}', matrix.node) }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@10.9.8 --no-audit --no-fund
      - name: Verify patched Node runtime
        run: >-
          node -e "console.log(JSON.stringify({version:process.version,execPath:process.execPath})); if (process.version !== 'v${{ matrix.node }}') process.exit(1)"
      - name: Install media probe
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - run: npm ci
      - run: npm --prefix apps/workflow-viewer ci
      - run: node --test scripts/offline-audit.node.mjs
      - run: npm run check
      # Root check excludes apps/**; keep Viewer unit/coverage required on Ubuntu.
      - run: npm run viewer:check
      - run: npm --prefix apps/workflow-viewer run security:audit
      - run: node bin/pipeline doctor --config examples/local-fixture/project.yaml --json
      - run: node bin/pipeline doctor --config fixtures/projects/hyperframes-local-media.yaml --json
      - run: node bin/pipeline validate --config examples/local-fixture/project.yaml --json
      - run: node bin/pipeline plan --config examples/local-fixture/project.yaml --json
      - run: node bin/pipeline run --config examples/local-fixture/project.yaml --dry-run --json
      - run: npm run security:audit

  macos-smoke:
    name: ${{ matrix.node == '22.23.4' && 'macos-smoke' || format('macos-smoke-node-{0}', matrix.node) }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@10.9.8 --no-audit --no-fund
      - name: Verify patched Node runtime
        run: >-
          node -e "console.log(JSON.stringify({version:process.version,execPath:process.execPath})); if (process.version !== 'v${{ matrix.node }}') process.exit(1)"
      - run: command -v ffmpeg || brew install ffmpeg
      - run: npm ci
      - run: npm --prefix apps/workflow-viewer ci
      - run: npm run build
      - run: npm run viewer:build
      - run: node .agents/skills/verify-tsugite/scripts/verify.mjs all --feature project-validation

  # Windows lane: platform smoke only. Full unit/coverage/vendor checks live in `check`.
  windows-smoke:
    name: ${{ matrix.node == '22.23.4' && 'windows-smoke' || format('windows-smoke-node-{0}', matrix.node) }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1', '26.12.1']
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@10.9.8 --no-audit --no-fund
      - name: Verify patched Node runtime
        run: >-
          node -e "console.log(JSON.stringify({version:process.version,execPath:process.execPath})); if (process.version !== 'v${{ matrix.node }}') process.exit(1)"
      - name: Install media probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            $winget = Get-Command winget -ErrorAction SilentlyContinue
            if ($winget) {
              & $winget.Source install --id Gyan.FFmpeg -e --accept-package-agreements --accept-source-agreements --silent --disable-interactivity

              $packages = Join-Path $env:LOCALAPPDATA "Microsoft\WinGet\Packages"
              $probe = Get-ChildItem $packages -Filter ffprobe.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($probe) {
                $binDirectory = $probe.Directory.FullName
                $env:PATH = "$binDirectory;$env:PATH"
                Add-Content -Path $env:GITHUB_PATH -Value $binDirectory
              }
            }
          }

          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version 8.1.2 --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "FFmpeg installation failed through winget and Chocolatey"
            }
          }

          ffmpeg -version
          ffprobe -version
      - run: npm ci
      - run: npm run security:audit
      - run: npm --prefix apps/workflow-viewer ci
      # Typecheck/build only — coverage suite already runs on Ubuntu `check`.
      - run: npm run build
      - run: npm run viewer:build
      - run: node bin/pipeline doctor --config examples/local-fixture/project.yaml --json
      - run: node bin/pipeline doctor --config fixtures/projects/hyperframes-local-media.yaml --json
      - run: node bin/pipeline validate --config examples/local-fixture/project.yaml --json
      - run: node bin/pipeline plan --config examples/local-fixture/project.yaml --json
      - run: node bin/pipeline review --config examples/local-fixture/project.yaml --json
      - run: node bin/pipeline viewer --config examples/local-fixture/project.yaml --json
      - run: node bin/pipeline run --config examples/local-fixture/project.yaml --dry-run --json
