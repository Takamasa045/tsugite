version: 2
# Public registry.npmjs.org only. Do not add a GitHub Packages
# (npm.pkg.github.com) registries block: this repo has no private npm
# packages, and an empty GITHUB_REGISTRIES_PROXY is the host warning when no
# private registries are declared. That warning is not the download-site
# undici update_files failure; miniflare still resolves undici 7.28.0/7.29.0
# while advisories require >= 7.29.1, so keep the patched override in
# apps/download-site/package.json and bump it manually when Dependabot cannot.
updates:
  - package-ecosystem: npm
    directory: /v2
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      v2-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      rendering-runtime:
        patterns:
          - remotion
          - "@remotion/*"
          - react
          - react-dom
          - "@types/react*"
        update-types:
          - minor
          - patch
      test-toolchain:
        patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - minor
          - patch
      maintenance:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      major-review:
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      maintenance:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      major-review:
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: npm
    directory: /apps/download-site
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      maintenance:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      major-review:
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: npm
    directory: /apps/workflow-viewer
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      maintenance:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      major-review:
        patterns:
          - "*"
        update-types:
          - major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
