name: elevenlabs-v4
kind: cli
class: generation
offline: false
network:
  input_scope: request-metadata
  timeout_ms: 300000
  credential_env: [ELEVENLABS_MCP_ACCESS_TOKEN]
dry_run_estimate: true
billing_policy: quote-required
auth:
  executable: node
  args: ["adapters/elevenlabs-v4/auth-command.mjs"]
  input: stdin-json
quote:
  executable: node
  args: ["adapters/elevenlabs-v4/quote.mjs"]
  input: stdin-json
resume:
  executable: node
  args: ["adapters/elevenlabs-v4/resume.mjs"]
  input: stdin-json
receipts:
  protocol: narration-v1
  directory: assets/elevenlabs-v4
batch: false
credit_estimate:
  per_request: 0
  per_second: 0
retry:
  max_attempts: 0
  retryable_exit_codes: []
exit_code_map:
  "0": ok
  "20": provider_unavailable
  "30": credential_missing
  "40": invalid_request
model_preflight:
  executable: node
  args: ["adapters/elevenlabs-v4/preflight.mjs"]
  input: stdin-json
command:
  executable: node
  args: ["adapters/elevenlabs-v4/generate.mjs"]
  input: stdin-json
