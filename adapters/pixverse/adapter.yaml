name: pixverse
kind: cli
prompt_capabilities:
  - model_profile_id: minimax-h3
    provider_model: minimax-h3
    modes: [text-to-video, first-frame, first-last, reference]
    renderer: h3-grammar
    label_dialect: picture
  - model_profile_id: v6
    provider_model: v6
    modes: [text-to-video, first-frame]
    renderer: plain-prompt
    label_dialect: none
  - model_profile_id: c1
    provider_model: c1
    modes: [text-to-video, first-frame]
    renderer: plain-prompt
    label_dialect: none
dry_run_estimate: true
batch: true
credit_estimate:
  per_request: 0
  per_second: 0
retry:
  max_attempts: 2
  retryable_exit_codes: [20, 21]
exit_code_map:
  "0": ok
  "20": transient
  "21": rate_limited
  "40": invalid_request
input_modes:
  text-to-video:
    forbidden_params: [image]
  image-to-video:
    # H3 first-frame uses first_frame; legacy prompt-only I2V uses params.image.
    required_any:
      - [first_frame, params.image]
  transition:
    # Real route accepts any image list source; count rules stay in schema / h3_execution_route.
    required_any:
      - [input_images, first_frame, params.image, reference_images]
  reference:
    # At least one media list; audio-only / caps remain in h3_execution_route.
    required_any:
      - [input_images, input_videos, input_audios]
checks:
  setup:
    - type: command
      name: provider:pixverse
      command: ["pixverse", "--version"]
      capture_version: true
      remediation:
        default: "Install the PixVerse CLI with `npm install -g pixverse@latest`, then rerun doctor."
    - type: manual
      name: provider-auth:pixverse
      blocking: false
      detail: "Authentication and provider connectivity are not contacted by doctor."
      remediation:
        default: "Run `pixverse auth status --json`; if needed, run `pixverse auth login` before Gate 1 approval."
command:
  executable: node
  args: ["adapters/pixverse/generate.mjs"]
  input: stdin-json
model_preflight:
  executable: node
  args: ["adapters/pixverse/preflight.mjs"]
  input: stdin-json
